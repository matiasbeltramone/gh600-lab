name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build MCP notes server + seed DB
        run: |
          cd mcp/notes-server
          npm ci
          npm run build
          node --experimental-strip-types scripts/seed.ts notes.db

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Setear `prompt` cambia el modo de "tag" a "agent" y saltea el
          # system prompt interno del action que fuerza el link "Create PR".
          # `track_progress: true` mantiene el comentario con checkboxes que
          # tag mode da por defecto.
          track_progress: true
          prompt: |
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Implementá el issue siguiendo lo que dice CLAUDE.md del repo.
            Después de commitear y pushear la branch, usá
            mcp__github__create_pull_request para abrir un PR draft (draft: true)
            contra main, con título descriptivo y body que incluya "Closes #${{ github.event.issue.number }}".
            NO dejes un link de "Create PR", creá el PR directo con la tool.

          claude_args: |
            --allowedTools "mcp__notes__list_notes,mcp__notes__read_note,mcp__github__create_pull_request,Bash(npm install),Bash(npm test),Bash(npm run typecheck),Bash(npx tsc --noEmit),Edit,Write,Read,Bash"
