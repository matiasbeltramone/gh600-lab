name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Opción A (si tenés API key de Anthropic):
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Opción B (usuarios con Claude Pro/Max via OAuth):
          # generá el token con `claude setup-token` y guardalo como
          # CLAUDE_CODE_OAUTH_TOKEN en Settings → Secrets → Actions
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          claude_args: |
            --allowedTools "Bash(npm install),Bash(npm test),Bash(npm run typecheck),Bash(npx tsc --noEmit),Bash(npx tsc:*),Bash(gh pr create:*),Bash(git checkout:*),Bash(git branch:*)"
