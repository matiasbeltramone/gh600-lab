name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    # Solo [opened]: con [opened, assigned] el issue dispara dos runs
    # (creación + assign), duplicando el trabajo y el costo. Acotado para
    # el experimento; reponer 'assigned' si se quiere en uso real.
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build MCP notes server + seed DB
        run: |
          cd mcp/notes-server
          npm ci
          npm run build
          node --experimental-strip-types scripts/seed.ts notes.db

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Setear `prompt` cambia el modo de "tag" a "agent" y saltea el
          # system prompt interno del action que fuerza el link "Create PR".
          # `track_progress: true` mantiene el comentario con checkboxes que
          # tag mode da por defecto.
          track_progress: true
          prompt: |
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Implementá el issue siguiendo lo que dice CLAUDE.md del repo.
            Después de commitear y pushear la branch, usá
            mcp__github__create_pull_request para abrir un PR draft (draft: true)
            contra main, con título descriptivo y body que incluya "Closes #${{ github.event.issue.number }}".
            NO dejes un link de "Create PR", creá el PR directo con la tool.

          # VERIFICADO (jul-2026): en headless el Action carga los subagentes
          # de .claude/agents/ (researcher/editor) y delega de verdad. La tool
          # de delegación se llama `Agent` (no `Task`) y NO hace falta
          # allow-listearla. `Grep`/`Glob` sí: son las tools read-only del
          # researcher, y en headless lo que no está acá queda denegado (sin
          # ellas no podría leer el repo).
          claude_args: |
            --allowedTools "mcp__notes__list_notes,mcp__notes__read_note,mcp__github__create_pull_request,Bash(npm install),Bash(npm test),Bash(npm run typecheck),Bash(npx tsc --noEmit),Edit,Write,Read,Bash,Grep,Glob"

      # Persiste el stream turno-por-turno de Claude como artifact. El log
      # de Actions solo retiene el init + el result final; el detalle (las
      # llamadas a tools, incluida la delegación) vive en execution_file y se
      # pierde con el runner. Se inspecciona buscando "name":"Agent" +
      # "subagent_type" en el JSON descargado con `gh run download`.
      - name: Subir execution stream como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-issue-${{ github.event.issue.number }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
