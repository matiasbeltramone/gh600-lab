name: Deploy

# Deploy stub del LAB de guardrails. Corre al mergear a main y referencia
# el environment `production`: ahí se activa el environment gate (required
# reviewers + wait timer). Es el controlled path de la acción irreversible.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying ${{ github.sha }} to production..."
